name: Weekly LeetCode Summary

on:
  schedule:
    # GitHub Actions uses UTC. 04:00 UTC is 12:00 in Asia/Taipei (UTC+8).
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Create AI weekly summary issue
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          script: |
            const now = new Date();
            const { owner, repo } = context.repo;
            const titlePattern = /^\[LeetCode\]\s+(\d{4}\/\d{2}\/\d{2})(?:\s*[（(]\d+[）)])?\s*$/u;

            const taipeiParts = (date) => Object.fromEntries(
              new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Taipei',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
              }).formatToParts(new Date(date))
                .filter((part) => part.type !== 'literal')
                .map((part) => [part.type, part.value]),
            );
            const taipeiDate = (date) => {
              const { year, month, day } = taipeiParts(date);
              return `${year}/${month}/${day}`;
            };
            const today = taipeiParts(now);
            const localTodayStart = new Date(`${today.year}-${today.month}-${today.day}T00:00:00+08:00`);
            const daysSinceSunday = new Date(Date.UTC(
              Number(today.year),
              Number(today.month) - 1,
              Number(today.day),
            )).getUTCDay();
            const reviewSundayStart = new Date(localTodayStart.getTime() - daysSinceSunday * 24 * 60 * 60 * 1000);
            const weekStart = new Date(reviewSundayStart.getTime() - 6 * 24 * 60 * 60 * 1000);
            const sourceEnd = new Date(reviewSundayStart.getTime() + 12 * 60 * 60 * 1000);

            const candidates = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });

            const issues = candidates
              .filter((issue) => !issue.pull_request)
              .map((issue) => {
                const match = issue.title.match(titlePattern);
                if (!match) return null;

                const [year, month, day] = match[1].split('/').map(Number);
                const calendarDate = new Date(Date.UTC(year, month - 1, day));
                if (
                  calendarDate.getUTCFullYear() !== year ||
                  calendarDate.getUTCMonth() !== month - 1 ||
                  calendarDate.getUTCDate() !== day
                ) return null;

                return {
                  ...issue,
                  recordDate: new Date(`${match[1].replace(/\//g, '-')}T00:00:00+08:00`),
                };
              })
              .filter((issue) =>
                issue &&
                issue.recordDate >= weekStart &&
                issue.recordDate < sourceEnd,
              )
              .sort((a, b) =>
                a.recordDate - b.recordDate || new Date(a.created_at) - new Date(b.created_at),
              );

            const body = [
              '# Weekly LeetCode Summary',
              '',
              `Review week: ${taipeiDate(weekStart)}–${taipeiDate(reviewSundayStart)} (Asia/Taipei)`,
              'Records covered: Monday through Sunday 12:00 (Asia/Taipei).',
              `Records: ${issues.length}`,
              '',
            ];

            if (issues.length === 0) {
              body.push('_No LeetCode records have a title date within this period._');
            }

            for (const issue of issues) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100,
              });
              const labels = issue.labels
                .map((label) => typeof label === 'string' ? label : label.name)
                .filter(Boolean)
                .join(', ') || 'None';

              body.push(
                `## [#${issue.number} ${issue.title}](${issue.html_url})`,
                '',
                `- Status: ${issue.state}`,
                `- Labels: ${labels}`,
                `- Record date: ${taipeiDate(issue.recordDate)}`,
                `- Issue created: ${taipeiDate(issue.created_at)}`,
                '',
                '### Issue body',
                '',
                issue.body || '_No description_',
                '',
              );

              if (comments.length > 0) {
                body.push('### Comments', '');
                for (const comment of comments) {
                  body.push(
                    `**${comment.user.login}** (${taipeiDate(comment.created_at)})`,
                    '',
                    comment.body || '_Empty comment_',
                    '',
                  );
                }
              }
            }

            if (!process.env.OPENAI_API_KEY) {
              core.setFailed('OPENAI_API_KEY is not configured. Add it as a repository Actions secret.');
              return;
            }

            const sourceRecords = body.join('\n');
            const response = await fetch('https://api.openai.com/v1/responses', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model: 'gpt-5.6-luna',
                reasoning: { effort: 'none' },
                max_output_tokens: 3600,
                store: false,
                instructions: [
                  'Write every explanation in Taiwan Traditional Chinese (zh-TW). Keep English only for unavoidable technical terms, code, and original issue titles.',
                  'Use only the supplied records; do not invent facts or solutions.',
                  'Write a revision guide for learning and retention, not a progress report.',
                  'Return Markdown only, with these sections: ## 本週核心觀念, ## 解題模式整理, ## 易錯點與盲區, ## 複習計畫, ## 主動回想題.',
                  'Explain the key patterns and why they work in plain language. Compare related problems when useful.',
                  'Give a prioritized review plan: what to re-solve first, what to revisit later, and one small next-week practice focus.',
                  'Include 3–5 short active-recall questions that can be answered without looking at the solutions.',
                  'Mention the relevant issue number(s) when making a specific observation.',
                  'Be concrete and actionable. If no records are supplied, state that clearly and suggest a light plan for next week.',
                ].join(' '),
                input: sourceRecords,
              }),
            });

            if (!response.ok) {
              const error = await response.text();
              core.setFailed(`OpenAI API request failed (${response.status}): ${error}`);
              return;
            }

            const aiResponse = await response.json();
            const summaryText = aiResponse.output
              .flatMap((item) => item.content || [])
              .filter((content) => content.type === 'output_text')
              .map((content) => content.text)
              .join('\n')
              .trim();

            if (!summaryText) {
              core.setFailed('OpenAI API returned no summary text.');
              return;
            }

            await github.rest.issues.create({
              owner,
              repo,
              title: `[LeetCode Weekly Review] ${taipeiDate(weekStart)}–${taipeiDate(reviewSundayStart)}`,
              body: summaryText,
              labels: ['leetcode', 'weekly'],
            });
